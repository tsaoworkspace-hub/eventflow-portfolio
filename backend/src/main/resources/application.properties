spring.application.name=eventflow-backend
server.port=${SERVER_PORT:8080}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.url=${DB_URL:jdbc:h2:mem:eventflow;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Creates JavaMailSender without sending mail unless the feature flag below is enabled.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}

app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.demo-mode=${APP_DEMO_MODE:true}

notification.redis.enabled=false
spring.data.redis.repositories.enabled=false
notification.redis.stream-key=notification-send-jobs
notification.redis.consumer-group=notification-workers
notification.redis.consumer-name=${HOSTNAME:local-worker}
notification.email.enabled=false
notification.product-release.enabled=false
notification.event-reminder.enabled=false

google.calendar.enabled=false
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
google.calendar.redirect-uri=http://localhost:8080/api/calendar/google/callback
google.calendar.token-encryption-key=${GOOGLE_CALENDAR_TOKEN_KEY:}
